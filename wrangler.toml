name = "guyub"
main = ".open-next/worker.js"
account_id = "45efd648d755765f15c147660432044a"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
ENVIRONMENT = "production"
NEXTAUTH_URL = "https://komunita.my.id"
NEXT_PUBLIC_URL = "https://komunita.my.id"
NEXT_PUBLIC_TRAKTEER_SLUG = "brokado"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[routes]]
pattern = "komunita.my.id/*"
zone_name = "komunita.my.id"

# Route lama tetap sampai login di komunita.my.id terbukti jalan, lalu dihapus
# (wrangler menghapus route yang hilang dari config). Host lama harus tetap
# punya DNS proxied supaya Redirect Rule 301 di dashboard Cloudflare jalan.
[[routes]]
pattern = "guyub.thedreamcompany.space/*"
zone_name = "thedreamcompany.space"

[observability]
enabled = true
